name: Build and deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "wordpress/**"
  repository_dispatch:
    types: [after_saving_wordpress]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SMITHARIA_SERVICE_KEY: ${{ secrets.SMITHARIA_SERVICE_KEY }}

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Test limited access
        run: npm run test:limited

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@13.29.1 deploy --only functions:limited,hosting --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
